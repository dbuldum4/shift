[package]
name = "shift"
version = "0.3.0"
edition = "2024"
rust-version = "1.85"
default-run = "shift"
license = "MIT"

[lib]
name = "shift_core"
path = "src/lib.rs"

[[bin]]
name = "shift"
path = "src/main.rs"

[[bin]]
name = "shift-cli"
path = "src/bin/shift-cli.rs"

[dependencies]
gpui = "=0.2.2"
lyon = "1.0"
futures = { version = "0.3", default-features = false, features = ["std"] }
unicode-segmentation = "1.12"
url = "2.5"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
zip = { version = "7.2.0", default-features = false, features = ["deflate"] }
rusqlite = { version = "0.40", features = ["bundled"] }
calamine = { version = "0.35.0", features = ["chrono"] }
csv = "1.4.0"
rust_xlsxwriter = { version = "0.96.0", features = ["chrono"] }

[target.'cfg(target_os = "macos")'.dependencies]
block = "0.1"
cocoa = "0.26"
objc = "0.2"

[dev-dependencies]
gpui = { version = "=0.2.2", features = ["test-support"] }

[profile.release]
lto = true
codegen-units = 1
panic = "unwind"
strip = true
