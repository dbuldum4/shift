name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  rust:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.0
          components: rustfmt, clippy
      - run: cargo fmt --check
      # objc 0.2 expands a historical `cargo-clippy` cfg in its macros. Keep
      # all project warnings fatal while allowing that upstream compatibility cfg.
      - run: cargo clippy --all-targets --all-features -- -D warnings -A unexpected-cfgs
      - run: cargo test --all-targets
      - name: Verify release metadata and script failure paths
        run: sh scripts/test-release-preflight.sh
      - name: Check package scripts parse
        run: sh -n scripts/package-macos.sh scripts/release-preflight.sh scripts/verify-macos-package.sh
      - name: Smoke the installed CLI version surface
        run: |
          version="$(awk -F'\"' '/^version = \"/ { print $2; exit }' Cargo.toml)"
          cargo run --locked --quiet --bin shift-cli -- --version | grep -Fqx "shift-cli $version"

  landing-page:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: landing-page
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: VITE_BASE_PATH=/shift/ bun run build
      - run: bun run test:sites
